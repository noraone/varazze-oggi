name: Aggiorna notizie Varazze

on:
  schedule:
    # ogni ora dalle 04:15 alle 21:15 UTC = dalle 6:15 alle 23:15 in Italia (ora legale)
    - cron: "15 4-21 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: [news.json]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiorna-notizie
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica le notizie
        run: python aggiorna.py
      - name: Salva news.json nel repository
        run: |
          git config user.name "varazze-oggi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Notizie aggiornate"
          git push
      - name: Prepara icona
        run: base64 -d icon.b64 > icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
