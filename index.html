<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Varazze Oggi</title>
<meta name="apple-mobile-web-app-title" content="Varazze Oggi">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0F4C73">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#12212C; --muted:#5B6B77; --line:#DCE3E8;
  --sea:#0F4C73; --ochre:#B7791F; --chip:#E6EDF2;
  --cronaca:#B23A2E; --sport:#2F7A4B; --eventi:#8A5A9E;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0D1820; --surface:#14232E; --ink:#E7EEF3; --muted:#93A5B2; --line:#243746;
    --sea:#7DB9E0; --ochre:#E0A94F; --chip:#1D3040;
    --cronaca:#F0847A; --sport:#74C893; --eventi:#C9A2DA;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,sans-serif;
  padding-inline:max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block:env(safe-area-inset-top, 0px) calc(40px + env(safe-area-inset-bottom, 0px))}
.wrap{max-width:680px;margin:0 auto}
header{padding-block:24px 14px;border-bottom:2px solid var(--sea)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);font-weight:700}
h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:44px;line-height:1;margin:6px 0 8px;color:var(--sea)}
.status{font-size:14px;color:var(--muted)}
.refresh{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:12px}
#refreshBtn{font:700 15px/1 "Source Sans 3",system-ui,sans-serif;background:var(--sea);color:var(--bg);border:0;border-radius:8px;padding:11px 16px;cursor:pointer}
#refreshBtn:disabled{opacity:.55}
.gh{font-size:14px;color:var(--sea);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px}
.filters button{font:600 14px/1 "Source Sans 3",system-ui,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.day{margin-top:18px}
.day h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.item{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:6px}
.item:first-child{border-top:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--chip);color:var(--sea)}
.tag.Cronaca{color:var(--cronaca)} .tag.Sport{color:var(--sport)} .tag.Eventi{color:var(--eventi)}
.item h3{margin:0;font-size:18px;line-height:1.3;font-weight:700}
.item p{margin:0;color:var(--muted);font-size:15px}
.open{justify-self:start;font-weight:700;color:var(--sea);text-decoration:none;font-size:15px;padding-block:4px}
.empty{padding:24px 16px;color:var(--muted);text-align:center}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Riviera del Beigua · SV</div>
    <h1>Varazze Oggi</h1>
    <div class="status" id="status">Caricamento notizie…</div>
    <div class="refresh">
      <button type="button" id="refreshBtn">Aggiorna</button>
      <a class="gh" id="ghLink" href="#" target="_blank" rel="noopener" hidden>Cerca nuove notizie ora (GitHub)</a>
    </div>
  </header>
  <nav class="filters" id="filters" aria-label="Filtra per categoria"></nav>
  <main id="feed"></main>
  <footer>Notizie raccolte in automatico 3 volte al giorno dai feed di IVG, Genova24, SavonaNews e Google News. Tocca “Leggi l’articolo” per aprire la fonte originale.</footer>
</div>
<script>
(function(){
  const CATS=["Tutte","Cronaca","Attualità","Politica","Eventi","Sport","Ambiente"];
  let items=[], cat="Tutte";
  try{ cat=localStorage.getItem("vz-cat")||"Tutte"; }catch(e){}
  const $f=document.getElementById("filters"), $feed=document.getElementById("feed"), $s=document.getElementById("status"), $btn=document.getElementById("refreshBtn");

  // link diretto al workflow su GitHub (utente.github.io/repo -> github.com/utente/repo)
  const m=location.hostname.match(/^([^.]+)\.github\.io$/);
  if(m){ const repo=location.pathname.split("/").filter(Boolean)[0]||(m[1]+".github.io");
    const a=document.getElementById("ghLink"); a.href="https://github.com/"+m[1]+"/"+repo+"/actions/workflows/aggiorna.yml"; a.hidden=false; }

  function drawFilters(){
    $f.textContent="";
    CATS.forEach(c=>{
      const b=document.createElement("button");
      b.type="button"; b.textContent=c; b.setAttribute("aria-pressed", String(c===cat));
      b.onclick=()=>{cat=c; try{localStorage.setItem("vz-cat",c)}catch(e){} drawFilters(); render();};
      $f.appendChild(b);
    });
  }
  const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  function fmtDay(key){
    const d=new Date(key+"T12:00:00"), t=new Date(), y=new Date(); y.setDate(t.getDate()-1);
    const s=d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
    return key===dayKey(t)?"Oggi · "+s : key===dayKey(y)?"Ieri · "+s : s;
  }
  function safeUrl(u){ try{const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:null;}catch(e){return null;} }
  function render(){
    $feed.textContent="";
    const list=items.filter(n=>cat==="Tutte"||n.category===cat);
    if(!list.length){ const e=document.createElement("div"); e.className="empty"; e.textContent=items.length?"Nessuna notizia in questa categoria.":"Ancora nessuna notizia."; $feed.appendChild(e); return; }
    const groups={};
    list.forEach(n=>{ const d=new Date(n.published); (groups[dayKey(d)] ||= []).push(n); });
    Object.keys(groups).sort().reverse().forEach(day=>{
      const sec=document.createElement("section"); sec.className="day";
      const h=document.createElement("h2"); h.textContent=fmtDay(day); sec.appendChild(h);
      const ul=document.createElement("div"); ul.className="list";
      groups[day].forEach(n=>{
        const it=document.createElement("article"); it.className="item";
        const mt=document.createElement("div"); mt.className="meta";
        const t=document.createElement("span"); t.className="tag "+n.category; t.textContent=n.category; mt.appendChild(t);
        const s=document.createElement("span"); s.textContent=n.source+" · "+new Date(n.published).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); mt.appendChild(s);
        const h3=document.createElement("h3"); h3.textContent=n.title;
        it.append(mt,h3);
        if(n.summary){ const p=document.createElement("p"); p.textContent=n.summary; it.appendChild(p); }
        const u=safeUrl(n.url);
        if(u){const a=document.createElement("a"); a.className="open"; a.href=u; a.target="_blank"; a.rel="noopener"; a.textContent="Leggi l’articolo →"; it.appendChild(a);}
        ul.appendChild(it);
      });
      sec.appendChild(ul); $feed.appendChild(sec);
    });
  }
  async function load(){
    $btn.disabled=true; $s.textContent="Caricamento notizie…";
    try{
      const r=await fetch("news.json?t="+Date.now(),{cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      const data=await r.json();
      items=data.items||[];
      $s.textContent="Ultimo aggiornamento: "+new Date(data.updated).toLocaleString("it-IT",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+" · "+items.length+" notizie";
    }catch(e){
      $s.textContent="Notizie non ancora disponibili: il primo aggiornamento non è ancora stato fatto oppure non c’è connessione.";
    }
    render(); $btn.disabled=false;
  }
  $btn.onclick=load;
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
  drawFilters(); load();
})();
</script>
</body>
</html>
